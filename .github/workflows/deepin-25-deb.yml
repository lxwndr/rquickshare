name: Build Deepin 25 DEB
# Rebuild trigger: validate the merged file-manager integration on Deepin 25.

on:
  push:
    branches:
      - ci/deepin-25-deb-build
      - feat/deepin-file-manager-context-menu
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deepin-25-deb:
    runs-on: ubuntu-latest
    container:
      image: linuxdeepin/deepin:crimson
      options: --user root
    env:
      RUSTUP_TOOLCHAIN: nightly-2025-01-15

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            librsvg2-bin \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            protobuf-compiler

      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-01-15

      - name: Show build environment
        run: |
          git config --global --add safe.directory '*'
          cat /etc/os-release
          node --version
          pnpm --version
          rustc --version
          cargo --version
          ldd --version | head -n 1

      - name: Install frontend dependencies
        working-directory: app/main
        run: pnpm install --frozen-lockfile

      - name: Generate Quick Share application icons
        shell: bash
        run: |
          set -euo pipefail
          icons="app/main/src-tauri/icons"
          color_svg="$icons/quickshare-color.svg"
          mono_svg="$icons/quickshare-mono.svg"
          test -s "$color_svg"
          test -s "$mono_svg"
          # Keep the colored artwork for the app, launcher, and taskbar.
          rsvg-convert -w 32 -h 32 "$color_svg" -o "$icons/32x32.png"
          rsvg-convert -w 128 -h 128 "$color_svg" -o "$icons/128x128.png"
          rsvg-convert -w 256 -h 256 "$color_svg" -o "$icons/128x128@2x.png"
          rsvg-convert -w 256 -h 256 "$color_svg" -o "$icons/256x256.png"
          rsvg-convert -w 512 -h 512 "$color_svg" -o "$icons/512x512.png"
          rsvg-convert -w 1024 -h 1024 "$color_svg" -o "$icons/icon.png"
          # Generate black and white transparent tray variants from the supplied monochrome artwork.
          rsvg-convert -w 256 -h 256 "$mono_svg" -o "$icons/tray-dark.png"
          sed 's/#000000/#ffffff/g; s/#000/#fff/g' "$mono_svg" > "$icons/.quickshare-mono-light.svg"
          rsvg-convert -w 256 -h 256 "$icons/.quickshare-mono-light.svg" -o "$icons/tray-light.png"
          rm "$icons/.quickshare-mono-light.svg"
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path
          icons = Path("app/main/src-tauri/icons")
          for name in ("32x32.png", "128x128.png", "128x128@2x.png", "256x256.png", "512x512.png", "icon.png", "tray-dark.png", "tray-light.png"):
              data = (icons / name).read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", f"{name}: invalid PNG signature"
              pos = 8
              seen_end = False
              while pos < len(data):
                  assert pos + 12 <= len(data), f"{name}: truncated chunk header"
                  size = struct.unpack(">I", data[pos:pos+4])[0]
                  kind = data[pos+4:pos+8]
                  end = pos + 12 + size
                  assert end <= len(data), f"{name}: truncated {kind.decode('ascii', 'replace')} chunk"
                  chunk = data[pos+4:pos+8+size]
                  crc = struct.unpack(">I", data[pos+8+size:end])[0]
                  assert zlib.crc32(chunk) & 0xffffffff == crc, f"{name}: CRC mismatch in {kind!r}"
                  pos = end
                  if kind == b"IEND":
                      seen_end = True
                      break
              assert seen_end and pos == len(data), f"{name}: missing IEND or trailing/truncated data"
              print(f"Validated {name} ({len(data)} bytes)")
          PY

      - name: Build DEB package
        working-directory: app/main
        run: pnpm tauri build --bundles deb

      - name: Add Deepin file-manager context menu
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(app/main/src-tauri/target/release/bundle/deb/*.deb)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No DEB package was produced."
            exit 1
          fi
          for package in "${packages[@]}"; do
            stage="$(mktemp -d)"
            rebuilt="${package%.deb}.with-context-menu.deb"
            dpkg-deb --extract "$package" "$stage"
            dpkg-deb --control "$package" "$stage/DEBIAN"
            # Install the original vector artwork as a scalable desktop icon.
            install -D -m 0644 app/main/src-tauri/icons/quickshare-color.svg \
              "$stage/usr/share/icons/hicolor/scalable/apps/dev.mandre.rquickshare.svg"
            install -D -m 0644 app/main/src-tauri/icons/quickshare-color.svg \
              "$stage/usr/share/icons/hicolor/scalable/apps/rquickshare.svg"
            # Ensure the desktop launcher resolves to the installed scalable icon.
            while IFS= read -r -d '' desktop_file; do
              sed -i 's/^Icon=.*/Icon=dev.mandre.rquickshare/' "$desktop_file"
            done < <(find "$stage/usr/share/applications" -type f -name '*.desktop' -print0 2>/dev/null || true)
            install -D -m 0644 packaging/deepin/context-menus/rquickshare.conf \
              "$stage/usr/etc/deepin/context-menus/rquickshare.conf"
            dpkg-deb --build --root-owner-group "$stage" "$rebuilt"
            mv "$rebuilt" "$package"
            rm -rf "$stage"
          done

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(app/main/src-tauri/target/release/bundle/deb/*.deb)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No DEB package was produced."
            find app/main/src-tauri/target/release/bundle -maxdepth 3 -type f -print || true
            exit 1
          fi
          for package in "${packages[@]}"; do
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package" | grep -F 'usr/etc/deepin/context-menus/rquickshare.conf'
            file "$package"
          done

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: rquickshare-deepin-25-deb
          path: app/main/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
