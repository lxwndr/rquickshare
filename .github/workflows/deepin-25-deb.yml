name: Build Deepin 25 DEB
# Rebuild trigger: validate the merged file-manager integration on Deepin 25.

on:
  push:
    branches:
      - ci/deepin-25-deb-build
      - feat/deepin-file-manager-context-menu
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deepin-25-deb:
    runs-on: ubuntu-latest
    container:
      image: linuxdeepin/deepin:crimson
      options: --user root
    env:
      RUSTUP_TOOLCHAIN: nightly-2025-01-15

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            protobuf-compiler

      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-01-15

      - name: Show build environment
        run: |
          git config --global --add safe.directory '*'
          cat /etc/os-release
          node --version
          pnpm --version
          rustc --version
          cargo --version
          ldd --version | head -n 1

      - name: Install frontend dependencies
        working-directory: app/main
        run: pnpm install --frozen-lockfile

      - name: Build DEB package
        working-directory: app/main
        run: pnpm tauri build --bundles deb

      - name: Add Deepin file-manager context menu
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(app/main/src-tauri/target/release/bundle/deb/*.deb)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No DEB package was produced."
            exit 1
          fi
          for package in "${packages[@]}"; do
            stage="$(mktemp -d)"
            rebuilt="${package%.deb}.with-context-menu.deb"
            dpkg-deb --extract "$package" "$stage"
            dpkg-deb --control "$package" "$stage/DEBIAN"
            install -D -m 0644 packaging/deepin/context-menus/rquickshare.conf \
              "$stage/usr/etc/deepin/context-menus/rquickshare.conf"
            dpkg-deb --build --root-owner-group "$stage" "$rebuilt"
            mv "$rebuilt" "$package"
            rm -rf "$stage"
          done

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(app/main/src-tauri/target/release/bundle/deb/*.deb)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No DEB package was produced."
            find app/main/src-tauri/target/release/bundle -maxdepth 3 -type f -print || true
            exit 1
          fi
          for package in "${packages[@]}"; do
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package" | grep -F 'usr/etc/deepin/context-menus/rquickshare.conf'
            file "$package"
          done

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: rquickshare-deepin-25-deb
          path: app/main/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
