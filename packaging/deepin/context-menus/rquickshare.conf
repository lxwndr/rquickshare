# RQuickShare integration for dde-file-manager
# Install to the system context-menus directory or the user's
# ~/.local/share/deepin/dde-file-manager/context-menus/ directory.

[Menu Entry]
Version=1.0
Comment=Send selected files with RQuickShare
Comment[pt_BR]=Enviar arquivos selecionados com o RQuickShare
Actions=RQuickShareSend

[Menu Action RQuickShareSend]
Name=QuickShare
Name[pt_BR]=QuickShare
X-DFM-MenuTypes=SingleFile:MultiFiles:SingleDir:MultiDirs:FileAndDir
X-DFM-ParentMenuPath=send-to
X-DFM-SupportSchemes=file
Exec=rquickshare %F
